name: Build policy docs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert markdown to docx
        run: |
          mkdir -p out build
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DATE="$(git for-each-ref --format='%(creatordate:short)' "refs/tags/${TAG}")"
          for src in policy.md policy-development.md; do
            sed -e "s/{{VERSION}}/${VERSION}/g" -e "s/{{DATE}}/${DATE}/g" "$src" > "build/$src"
          done
          pandoc build/policy.md             -o "out/policy-${TAG}.docx"
          pandoc build/policy-development.md -o "out/policy-development-${TAG}.docx"

      - name: Create release with docx files
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.docx
          generate_release_notes: true
